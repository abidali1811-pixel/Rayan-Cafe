{% extends "base.html" %}
{% block content %}
<div class="admin-layout">
  <aside class="admin-sidebar" aria-label="Admin navigation">
    <a class="admin-brand" href="{{ url_for('admin_dashboard') }}">
      <span class="brand-mark">RC</span>
      <span><strong>{{ cafe.CAFE_NAME }}</strong><small>Owner dashboard</small></span>
    </a>
    <nav class="admin-nav">
      <a href="{{ url_for('admin_dashboard') }}" {% if request.endpoint == 'admin_dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="{{ url_for('admin_menu') }}" {% if request.endpoint == 'admin_menu' %}aria-current="page"{% endif %}>Menu &amp; prices</a>
      <a href="{{ url_for('admin_gallery') }}" {% if request.endpoint == 'admin_gallery' %}aria-current="page"{% endif %}>Gallery</a>
      <a href="{{ url_for('admin_bookings') }}" {% if request.endpoint == 'admin_bookings' %}aria-current="page"{% endif %}>Bookings</a>
      <a href="{{ url_for('admin_accounts') }}" {% if request.endpoint == 'admin_accounts' %}aria-current="page"{% endif %}>Admin users</a>
    </nav>
    <form class="admin-logout" method="post" action="{{ url_for('admin_logout') }}">
      <button class="btn" type="submit">Log out</button>
    </form>
  </aside>
  <div class="admin-content">{% block admin_body %}{% endblock %}</div>
</div>
{% endblock %}
