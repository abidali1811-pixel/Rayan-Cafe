<aside class="chat-dock" aria-label="Café assistant">
  <button class="chat-toggle btn" type="button" id="chat-toggle" aria-expanded="false">Ask about the menu</button>
  <section class="chat-panel" id="chat-panel" hidden>
    <header>
      <strong>Café assistant</strong>
      <p>Ask about coffee, tea, breakfast, and prices.</p>
    </header>
    <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
    <form class="chat-form" id="chat-form">
      <label class="sr-only" for="chat-input">Your question</label>
      <input id="chat-input" name="message" autocomplete="off" placeholder="How much is a cappuccino?">
      <button class="btn" type="submit">Send</button>
    </form>
  </section>
</aside>
